name: Deploy & Production Smoke Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      deployments: write
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      - name: Run Tests
        run: npm run test:run

      - name: Build with OpenNext
        run: npx @opennextjs/cloudflare build

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run Local Production Smoke Check
        env:
          PLAYWRIGHT_SERVER_CMD: "npm run build && npm run start"
        run: npm run test:smoke

  post_deploy_smoke:
    needs: deploy
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps
      - name: Wait for Cloudflare deployment propagation
        run: sleep 45
      - name: Verify live https://score-board.net hydration & CSP
        env:
          PLAYWRIGHT_BASE_URL: "https://score-board.net"
        run: npm run test:smoke
